<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 · Ulang Kaji Unit 1–5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ea;color:#16362d;font:17px/1.5 system-ui}header,main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(32px,6vw,65px);line-height:1;margin:.3em 0}nav{position:sticky;top:0;background:#153d31;color:white;padding:12px;z-index:2;text-align:center}nav a{color:white;margin:0 .35em;display:inline-block}section{scroll-margin-top:115px}fieldset,article{background:white;border:1px solid #ccd6cd;border-radius:12px;padding:16px;margin:12px 0;min-width:0}legend{font-weight:bold;background:white;padding:0 6px}label.option{display:block;padding:6px;cursor:pointer}textarea,input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid #799084;border-radius:6px}button{background:#164737;color:white;padding:10px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}#result{scroll-margin-top:110px}.feedback{color:#16593c;font-weight:bold}
fieldset{width:100%;min-inline-size:0}fieldset legend{display:table;float:left;width:100%;max-inline-size:100%;padding:0 0 8px;white-space:normal;overflow-wrap:anywhere}fieldset legend+label{clear:both}label.option,article label{overflow-wrap:anywhere}article label{display:block}textarea{max-width:100%;resize:vertical}</style><header><strong>YEAR 8 · BAHASA MELAYU</strong><h1>Ulang Kaji Unit 1–5</h1><p>Jawab 40 soalan objektif dan taip jawapan bagi 10 soalan subjektif. Draf disimpan dalam pelayar ini.</p></header>
<nav id="nav"></nav><main><form id="quiz"><article><label>Nama murid <input type="text" name="nama" required></label><label>Kelas <input type="text" name="kelas" required></label></article><div id="questions"></div><button type="submit">Semak dan lengkapkan latihan</button></form><article id="result" hidden tabindex="-1"></article></main>
<script>
const groups=[["Perayaan dan Majlis Istimewa", [["Apakah ucapan yang sesuai semasa sambutan Hari Raya?", "Selamat Hari Raya", "Selamat jalan", "Selamat maju jaya", "Selamat pagi"], ["Apakah yang biasanya ditiup oleh orang yang menyambut hari jadi?", "Lilin", "Belon", "Reben", "Bunga"], ["“Sila datang ke majlis saya pada hari Ahad.” Apakah tujuan mesej ini?", "Menjemput kawan", "Mengucapkan selamat tinggal", "Meminta alamat rumah", "Meminjam barang"], ["Ibu menyediakan makanan untuk tetamu. Siapakah tetamu?", "Orang yang datang berkunjung", "Orang yang memasak", "Orang yang menjual tiket", "Orang yang memandu bas"], ["Majlis bermula pukul tiga petang di dewan sekolah. Di manakah majlis itu diadakan?", "Di dewan sekolah", "Di kantin", "Di rumah", "Di taman"], ["Apakah yang boleh kamu ucapkan kepada rakan pada hari jadinya?", "Selamat hari jadi!", "Selamat pulang!", "Selamat bercuti!", "Selamat bertugas!"]]], ["Pelancongan", [["Di manakah kamu boleh melihat barang bersejarah?", "Muzium", "Pantai", "Lapangan terbang", "Hotel"], ["Apakah barang yang membantu kamu mencari lokasi tempat lawatan?", "Peta", "Payung", "Tuala", "Botol"], ["“Bilik kami terletak di tingkat tiga.” Di manakah pelancong biasanya menyewa bilik untuk bermalam?", "Hotel", "Muzium", "Taman", "Stesen bas"], ["Apakah aktiviti yang sesuai di pantai?", "Bermain pasir", "Melihat barang purba dalam galeri", "Meminjam buku di kaunter", "Menaiki lif ke bilik hotel"], ["Rina membeli cenderamata semasa melawat Melaka. Apakah maksud cenderamata?", "Barang kenang-kenangan", "Tiket perjalanan", "Peta bandar", "Beg pakaian"], ["Bas bertolak pukul sembilan pagi. Apakah maklumat yang diberi?", "Waktu bertolak", "Harga tiket", "Nama pemandu", "Tempat bermalam"]]], ["Panduan Arah", [["Apakah maksud “belok kiri”?", "Turn left", "Turn right", "Go straight", "Stop here"], ["“Sila jalan terus hingga ke lampu isyarat.” Apakah yang perlu kamu buat dahulu?", "Jalan terus", "Belok kiri", "Belok kanan", "Patah balik"], ["Kedai itu terletak di sebelah bank. Apakah maksud “di sebelah”?", "Next to", "Behind", "Inside", "Far from"], ["Amin bergerak ___ sekolah ke perpustakaan. Pilih perkataan yang menunjukkan tempat dia bermula.", "dari", "di", "kepada", "pada"], ["Kamu berada di hadapan kedai. Hospital berada betul-betul di seberang jalan. Di manakah hospital itu?", "Bertentangan dengan kedai", "Di dalam kedai", "Di belakang kedai", "Di sebelah kedai"], ["“Selepas jambatan, belok kanan.” Bilakah kamu perlu membelok?", "Selepas melalui jambatan", "Sebelum sampai ke jambatan", "Semasa berada di tengah jambatan", "Sebelum mula berjalan"]]], ["Rekreasi dan Hiburan", [["Apakah aktiviti yang menggunakan basikal?", "Berbasikal", "Berjoging", "Berkelah", "Berenang"], ["Di manakah kamu biasanya menonton filem di skrin besar bersama penonton lain?", "Pawagam", "Dewan makan", "Kedai buku", "Pejabat pos"], ["Lina membawa makanan dan tikar ke taman untuk makan bersama keluarga. Apakah aktiviti mereka?", "Berkelah", "Berenang", "Bermain badminton", "Menonton konsert"], ["“Saya gemar mendengar muzik pada masa lapang.” Apakah aktiviti yang digemarinya?", "Mendengar muzik", "Membaca buku", "Menonton filem", "Melukis gambar"], ["Amir lebih suka berenang kerana aktiviti itu menyeronokkan. Apakah yang dinyatakan selepas “kerana”?", "Sebab Amir suka berenang", "Waktu Amir berenang", "Tempat Amir berenang", "Nama kawan Amir"], ["Aktiviti badminton dibatalkan kerana hujan. Apakah sebab aktiviti itu dibatalkan?", "Hujan turun.", "Gelanggang terlalu jauh.", "Raket sudah rosak.", "Pemain pulang awal."]]], ["Perkhidmatan Awam", [["Di manakah kamu boleh menghantar bungkusan?", "Pejabat pos", "Hospital", "Balai polis", "Perpustakaan"], ["Apakah perkhidmatan utama di hospital?", "Memberikan rawatan", "Menerima bungkusan untuk dipos", "Meminjamkan buku", "Membuat laporan kehilangan"], ["Dompet kamu dicuri. Di manakah kamu boleh membuat laporan polis?", "Balai polis", "Pejabat pos", "Perpustakaan", "Dewan orang ramai"], ["Apakah kemudahan yang paling sesuai untuk meminjam buku?", "Perpustakaan awam", "Hospital", "Balai polis", "Pejabat pos"], ["Apakah yang biasanya dilakukan oleh petugas di kaunter pertanyaan?", "Memberikan maklumat kepada pengunjung", "Memandu bas ke sekolah", "Mengajar murid bermain bola", "Menjual sayur di pasar"], ["“Ambil nombor giliran sebelum ke kaunter.” Apakah tindakan pertama?", "Ambil nombor giliran.", "Pergi terus ke kaunter.", "Keluar dari bangunan.", "Tunggu bas di luar."]]], ["Tatabahasa", [["Yang manakah kata nama khas?", "Melaka", "bandar", "pantai", "muzium"], ["Yang manakah kata nama am?", "hospital", "Sara", "Sabah", "Hari Raya Aidilfitri"], ["“Farah menghantar surat.” Apakah kata kerjanya?", "menghantar", "Farah", "surat", "Farah menghantar"], ["Pilih ejaan kata sendi yang betul.", "di pejabat pos", "dipejabat pos", "di-pejabat pos", "diPejabat pos"], ["Mereka berjalan ___ pawagam selepas makan.", "ke", "di", "dari", "pada"], ["Kad hari jadi itu ___ ibu saya.", "daripada", "dari", "ke", "di"], ["Kami pergi ___ hotel ke muzium dengan bas.", "dari", "daripada", "kepada", "pada"], ["Saya membawa payung ___ hari hujan.", "kerana", "tetapi", "atau", "sambil"], ["Saya mahu berbasikal, ___ tayar basikal saya pancit.", "tetapi", "supaya", "kerana", "sambil"], ["Pilih penjodoh bilangan untuk “dua ___ basikal”.", "buah", "ekor", "orang", "helai"]]]];
const writing=[["Tulis satu ucapan untuk menyambut hari jadi rakan."], ["Jemput kawan ke majlis kamu. Tulis satu ayat yang menyatakan hari dan tempat majlis."], ["Namakan satu tempat pelancongan dan satu aktiviti yang boleh dibuat di situ."], ["Nyatakan satu barang yang kamu bawa semasa melancong dan sebabnya."], ["Tulis dua arahan berdasarkan maklumat ini: jalan terus hingga ke jambatan, kemudian belok kiri."], ["Klinik berada betul-betul di sebelah kedai. Tulis satu ayat untuk menerangkan kedudukan klinik."], ["Namakan satu aktiviti masa lapang yang kamu suka dan beri satu sebab."], ["Kamu mahu menghantar bungkusan. Nyatakan tempat yang perlu kamu pergi dan tujuan kamu ke sana."], ["Betulkan dua kesalahan ejaan kata sendi ini. “Saya menunggu diperhentian bas sebelum pergi kemuzium.”"], ["Gabungkan ayat ini menggunakan “kerana”. “Saya pergi ke hospital. Saya perlu mendapatkan rawatan.”"]];
const form=document.querySelector('#quiz'), questions=document.querySelector('#questions'), result=document.querySelector('#result');
const objective=groups.flatMap(([,items])=>items);
let number=0;
function choices(item,index){
 const [question,...answers]=item;
 const turn=(index*7+Math.floor(index/4))%4;
 const rotated=answers.slice(turn).concat(answers.slice(0,turn));
 return '<fieldset><legend>'+(index+1)+'. '+question+'</legend>'+rotated.map(answer=>'<label class="option"><input required type="radio" name="q'+index+'" value="'+answers.indexOf(answer)+'"> '+answer+'</label>').join('')+'</fieldset>';
}
questions.innerHTML=groups.map(([name,items],index)=>'<section id="g'+index+'"><h2>'+name+'</h2>'+items.map(item=>choices(item,number++)).join('')+'</section>').join('')+'<section id="subjective"><h2>Subjektif</h2>'+writing.map(([question],index)=>'<article><label for="s'+index+'">'+(41+index)+'. '+question+'</label><textarea required rows="3" id="s'+index+'" name="s'+index+'"></textarea></article>').join('')+'</section>';
document.querySelector('#nav').innerHTML=groups.map((_,i)=>'<a href="#g'+i+'">'+(i===5?'Tatabahasa':'Unit '+(i+1))+'</a>').join('')+' <a href="#subjective">Subjektif</a> <span id="progress"></span>';
const storageKey='year8-units1to5-v1';
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 for(const [name,value] of Object.entries(saved)){
  const field=form.elements.namedItem(name);
  if(field)field.value=value;
 }
}catch{}
function update(){
 const values=Object.fromEntries(new FormData(form));
 const answered=Object.entries(values).filter(([name,value])=>/^[qs]\d+$/.test(name)&&value.trim()).length;
 document.querySelector('#progress').textContent=answered+' / 50';
 try{localStorage.setItem(storageKey,JSON.stringify(values))}catch{}
}
form.addEventListener('input',()=>{result.hidden=true;update()});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 for(const field of form.querySelectorAll('textarea,input[type=text]')){
  if(!field.value.trim()){field.focus();return}
 }
 const values=new FormData(form);
 const score=objective.reduce((sum,_,i)=>sum+Number(values.get('q'+i)==='0'),0);
 result.innerHTML='<p class="feedback">50 daripada 50 soalan dijawab</p><p id="identity"></p>'+'<h2>Objektif '+score+' / 40</h2><p>Jawapan subjektif tersedia untuk semakan guru. Ambil tangkapan skrin keputusan ini.</p><button id="download">Muat turun jawapan</button><details><summary>Semak jawapan objektif</summary><ol>'+objective.map((item,i)=>'<li>'+item[1]+(values.get('q'+i)==='0'?' ✓':'')+'</li>').join('')+'</ol></details>';
 document.querySelector('#identity').textContent=values.get('nama')+' · '+values.get('kelas');
 document.querySelector('#download').onclick=()=>{
  const report=['Nama: '+values.get('nama'),'Kelas: '+values.get('kelas'),'Objektif: '+score+'/40','',...objective.map((item,i)=>(i+1)+'. '+item[1+Number(values.get('q'+i))]),'',...writing.map(([q],i)=>(41+i)+'. '+q+'\n'+values.get('s'+i))].join('\n');
  const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='jawapan-year8.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 result.hidden=false;result.focus();result.scrollIntoView();
});
update();
</script></html>
